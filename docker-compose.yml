version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: inventario_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventario_equipos
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inventario_network

  app:
    build: .
    container_name: inventario_app
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventario_equipos?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: tu_clave_secreta_muy_larga_cambiar_en_produccion
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    networks:
      - inventario_network

volumes:
  mysql_data:

networks:
  inventario_network:
    driver: bridge
