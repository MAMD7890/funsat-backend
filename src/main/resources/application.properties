spring.application.name=sistema-inventario-equipos
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.servlet.context-path=/api
server.error.include-message=always

# Flyway es el dueno del esquema; Hibernate solo valida que las entidades
# coincidan con lo que crearon las migraciones (nunca create/create-drop/update).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-cambiar-en-produccion-minimo-32-caracteres}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

app.uploads.dir=${UPLOADS_DIR:uploads/evidencias}

# Correo (resumen diario de alertas): opcional. Si spring.mail.host queda
# vacio, AlertaEmailService detecta que no hay servidor configurado y
# simplemente omite el envio (sin fallar el arranque ni las peticiones).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.alertas.remitente=${MAIL_FROM:no-reply@funsat.local}
app.alertas.dias-equipo-en-calle=${DIAS_ALERTA_EQUIPO_EN_CALLE:30}
app.alertas.cron=${ALERTAS_CRON:0 0 7 * * *}
